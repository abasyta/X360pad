name: Build PS3 PKG
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/ps3dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain (debug)
        run: |
          echo "PS3DEV=$PS3DEV PSL1GHT=$PSL1GHT"
          ls $PS3DEV/bin | head -50
          find / -name sfo.xml 2>/dev/null | head
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: xbox360pad-pkg
          path: "*.pkg"
